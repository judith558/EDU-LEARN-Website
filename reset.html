<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set new password | EduLearn</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js" defer></script></head><body><main><section class="auth-shell"><div class="auth-card"><span class="eyebrow">SECURE UPDATE</span><h1>Choose a new password</h1><p class="muted">Use at least eight characters. This link expires for your protection.</p><div data-auth-setup></div><form data-auth-form="reset" class="auth-form"><label>New password<div class="input-with-action"><input id="resetPassword" name="password" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-password-toggle="resetPassword">Show</button></div></label><label>Confirm new password<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><div data-auth-message class="form-message"></div><button class="btn btn-large" type="submit">Update password</button></form></div></section></main></body></html>
