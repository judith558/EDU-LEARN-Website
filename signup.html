<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | EduLearn</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js" defer></script></head><body><header class="site-header"><nav class="container nav-bar"><a href="index.html" class="logo"><span class="logo-icon">&lt;/&gt;</span>Edu<span class="light">Learn</span></a><ul class="nav-links"><li><a href="courses.html">Browse courses</a></li><li><a href="login.html">Log in</a></li></ul></nav></header><main><section class="auth-shell"><div class="auth-card"><span class="eyebrow">START YOUR PATH</span><h1>Create your learner account</h1><p class="muted">One account for courses, progress, quizzes and certificates.</p><div data-auth-setup></div><form data-auth-form="signup" class="auth-form"><label>Full name<input name="fullName" required autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Username<input name="username" required minlength="3" pattern="[A-Za-z0-9_]+" autocomplete="username"></label><label>Password<div class="input-with-action"><input id="signupPassword" name="password" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-password-toggle="signupPassword">Show</button></div></label><label>Confirm password<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><div data-auth-message class="form-message"></div><button class="btn btn-large" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></section></main></body></html>
